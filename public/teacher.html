<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Money Moves Facilitator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Layout: classroom control desk — class list rail on the left, roster and tools on the right. Same transit-signage identity as the game. */
:root{
  --ink:#0E1326; --panel:#151B35; --panel-2:#1F2850; --line:#33407A;
  --cream:#F6F1E3; --muted:#A8B0D3; --dim:#6E77A3;
  --orange:#FF6319; --yellow:#FCCC0A; --yellow-d:#B98F00; --green:#18B45B; --blue:#3C78F0; --red:#F04848;
  --display:'Bungee','Arial Black',Impact,system-ui,sans-serif;
  --body:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--ink);color:var(--cream);font:15px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-block:20px 48px;display:grid;gap:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:28px;line-height:1;margin:0;text-shadow:0 3px 0 var(--orange)}
.logo span{color:var(--yellow)}
.logo small{display:block;font-size:11px;letter-spacing:.14em;color:var(--orange);text-shadow:none;margin-top:6px}
.me{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:18px}
.btn{font-family:var(--display);font-size:13px;letter-spacing:.03em;background:var(--yellow);color:var(--ink);border:none;border-radius:999px;padding:10px 18px;cursor:pointer;box-shadow:0 3px 0 var(--yellow-d);white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--cream);border:2px solid var(--line);box-shadow:none}
.btn.red{background:var(--red);color:var(--cream);box-shadow:0 3px 0 #9A2626}
.btn.sm{font-size:11px;padding:6px 12px}
.field{display:grid;gap:6px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input:not([type]),select{background:var(--panel-2);border:2px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--yellow)}
.msg{font-size:13.5px;line-height:1.45}
.msg.ok{color:var(--green)} .msg.bad{color:var(--red)} .msg.note{color:var(--muted)}
.login{max-width:420px;margin:8vh auto 0;display:grid;gap:14px}
.login h1{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.rail{display:grid;gap:12px}
.rail h2,.main h2{font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.08em;color:var(--orange);margin:0}
.clist{display:grid;gap:6px}
.citem{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;width:100%;background:var(--panel-2);border:2px solid transparent;border-radius:12px;padding:10px 12px;cursor:pointer}
.citem b{font-family:var(--mono);font-weight:500}
.citem small{color:var(--muted);font-size:12px;display:block}
.citem[aria-current="true"]{border-color:var(--yellow)}
.citem.off{opacity:.55}
.newcls{display:grid;gap:8px}
.main{display:grid;gap:16px;min-width:0}
.chead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.chead h3{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1}
.chead p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.tabs{display:inline-flex;justify-self:start;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.tabs button{font-family:var(--display);font-size:12px;background:transparent;border:none;color:var(--muted);padding:8px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel-2);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.tile span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tile b{font-family:var(--mono);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;padding:10px 12px;background:var(--panel-2);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.num{font-family:var(--mono);text-align:right}
th.num{text-align:right}
td .sub{color:var(--muted);font-size:12px}
.bar{display:inline-block;width:70px;height:6px;border-radius:4px;background:var(--ink);overflow:hidden;vertical-align:middle;margin-right:8px}
.bar i{display:block;height:100%;background:var(--green)}
.pill{font-family:var(--display);font-size:10px;border-radius:999px;padding:2px 8px}
.pill.g{background:var(--green);color:var(--ink)} .pill.y{background:var(--yellow);color:var(--ink)} .pill.d{background:var(--panel-2);color:var(--muted)}
.rowact{display:flex;gap:6px;align-items:center}
.rowact input{width:96px;padding:5px 8px;font-family:var(--mono)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.tools input{max-width:260px}
.evgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.ev{background:var(--panel-2);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start}
.ev b{font-family:var(--display);font-weight:400;font-size:15px}
.ev p{margin:0;color:var(--muted);font-size:13px}
.ev code{font-family:var(--mono);color:var(--yellow)}
.hist{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--panel-2);border-radius:12px}
/* big screen */
#big{position:fixed;inset:0;background:var(--ink);z-index:10;overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
#big .bw{max-width:1100px;margin:0 auto;display:grid;gap:16px}
#big header .logo{font-size:clamp(30px,5vw,56px)}
#big .join{font-size:clamp(15px,1.8vw,22px);color:var(--muted);text-align:right}
#big .join b{font-family:var(--mono);color:var(--yellow);font-size:1.3em;letter-spacing:.06em}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.lbr{display:grid;grid-template-columns:56px minmax(0,1fr) minmax(80px,220px) 70px 140px;gap:14px;align-items:center;background:var(--panel-2);border-radius:16px;padding:14px 20px;font-size:clamp(17px,2.2vw,26px)}
.lbr .rk{font-family:var(--display);color:var(--muted);text-align:center}
.lbr.t1 .rk{color:var(--yellow)} .lbr.t2 .rk{color:#DCE1EE} .lbr.t3 .rk{color:#F0965A}
.lbr.t1{background:linear-gradient(90deg,rgba(252,204,10,.18),var(--panel-2) 60%)}
.lbr .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr .pg{height:10px;border-radius:6px;background:var(--ink);overflow:hidden}
.lbr .pg i{display:block;height:100%;background:var(--green)}
.lbr .ms{font-family:var(--mono);font-size:.7em;color:var(--muted);text-align:right}
.lbr .pt{font-family:var(--mono);text-align:right}
@media (max-width:820px){.layout{grid-template-columns:1fr}.lbr{grid-template-columns:40px minmax(0,1fr) 60px 90px}.lbr .pg{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="big" hidden></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>new Intl.NumberFormat('en-US').format(Math.round(n||0));
const cfg=window.MM_CONFIG||{};
const configured=!!(cfg.supabaseUrl&&cfg.supabaseAnonKey&&!/YOUR-PROJECT|YOUR-ANON/.test(cfg.supabaseUrl+cfg.supabaseAnonKey)&&window.supabase&&window.supabase.createClient);
const sb=configured?window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'mm-teacher-auth'}}):null;
const EVENTS=[
  ['CRASH','Market crash!','Stocks fall 25%. Do players panic-sell or stay the course?'],
  ['RENT','Rent goes up!','Family rent rises $100/month. Do players cut wants or savings?'],
  ['BONUS','Surprise bonus!','Everyone gets $200. Save it, split it, or spend it?'],
  ['PHISH','Phishing wave!','A fake prize text asks for bank logins.'],
  ['PRICE','Prices jump!','Groceries and lunch cost 10% more this month.'],
  ['LAYOFF','The camp closes for two weeks!','No shifts: $150 short. Who has an emergency fund?'],
];
// same daily code formula as the game (for players without accounts)
function h32(str){let h=2166136261;for(const ch of str){h^=ch.codePointAt(0);h=Math.imul(h,16777619);}return h>>>0;}
const today=()=>{const d=new Date();return`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;};
const classCode=id=>id+String(h32(id+'|'+today())%90+10);
const TOTAL=20;const tr_lv=ms=>ms>=14?'Level 3 · City':ms>=8?'Level 2 · College':'Level 1 · Queens';
const ago=t=>{if(!t)return'—';const s=(Date.now()-Date.parse(t))/1000;if(s<90)return'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' d ago';};

const st={user:null,fac:null,classes:[],cls:null,roster:[],runs:{},events:[],tab:'roster',filter:'',msg:null,pin:{},confirm:null,timer:null};

function flash(text,kind){st.msg={text,kind:kind||'ok'};const m=$('#flash');if(m){m.className='msg '+st.msg.kind;m.textContent=text;}}

/* ---------- auth ---------- */
function renderSetup(){
  $('#app').innerHTML=`<div class="login panel"><h1>Connect your database first</h1>
  <p class="msg note">This page needs your Supabase project. Open <code>config.js</code> and fill in <b>supabaseUrl</b> and <b>supabaseAnonKey</b> (Supabase → Project Settings → API). The README walks through it.</p></div>`;
}
function renderLogin(err){
  $('#app').innerHTML=`<div class="login panel">
    <h1 class="logo">Money<span>Moves</span><small>FACILITATOR</small></h1>
    <div class="field"><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username"></div>
    <div class="field"><label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password"></div>
    <div class="msg bad" id="lErr">${esc(err||'')}</div>
    <button class="btn" id="lGo">Log in</button>
    <p class="msg note">Facilitator accounts are added in Supabase (README, step 4). Students log in inside the game with their class code.</p></div>`;
  const go=async()=>{$('#lGo').disabled=true;$('#lErr').textContent='';
    const {error}=await sb.auth.signInWithPassword({email:$('#lEmail').value.trim(),password:$('#lPass').value});
    if(error){$('#lGo').disabled=false;$('#lErr').textContent='That email and password don’t match.';return;}
    boot();};
  $('#lGo').onclick=go;$('#lPass').onkeydown=e=>{if(e.key==='Enter')go();};
}
function renderNotFacilitator(){
  $('#app').innerHTML=`<div class="login panel"><h1>Almost there</h1>
  <p>You’re signed in as <b>${esc(st.user.email)}</b>, but this account isn’t a facilitator yet. In Supabase → SQL Editor, run:</p>
  <pre style="white-space:pre-wrap;background:var(--panel-2);padding:12px;border-radius:10px;font-family:var(--mono);font-size:13px;user-select:all">insert into public.facilitators (user_id, name)\nvalues ('${esc(st.user.id)}', 'Your name');</pre>
  <div class="row" style="display:flex;gap:10px"><button class="btn" id="nfRe">I ran it, check again</button><button class="btn ghost" id="nfOut">Log out</button></div></div>`;
  $('#nfRe').onclick=boot;$('#nfOut').onclick=logout;
}
async function logout(){clearInterval(st.timer);await sb.auth.signOut();location.reload();}

/* ---------- data ---------- */
async function loadClasses(){
  const {data}=await sb.from('classes').select('id,code,name,active,created_at').eq('facilitator_id',st.user.id).order('created_at',{ascending:false});
  st.classes=data||[];if(st.cls)st.cls=st.classes.find(c=>c.id===st.cls.id)||null;
  if(!st.cls)st.cls=st.classes.find(c=>c.active)||st.classes[0]||null;
}
async function loadRoster(){
  if(!st.cls){st.roster=[];return;}
  const {data,error}=await sb.from('students').select('user_id,username,display_name,created_at,last_seen,lang,progress(score,best,milestones,stars,done,updated_at)').eq('class_id',st.cls.id).order('created_at');
  if(error){flash('Couldn’t load the roster: '+error.message,'bad');return;}
  st.roster=(data||[]).map(r=>{const p=Array.isArray(r.progress)?r.progress[0]:r.progress;return Object.assign({},r,{p:p||{}});});
  const ids=st.roster.map(r=>r.user_id);st.runs={};
  if(ids.length){const {data:runs}=await sb.from('runs').select('user_id,score,finished_at').in('user_id',ids);(runs||[]).forEach(r=>{(st.runs[r.user_id]=st.runs[r.user_id]||[]).push(r);});}
}
async function loadEvents(){
  if(!st.cls){st.events=[];return;}
  const {data}=await sb.from('class_events').select('id,ev,created_at').eq('class_id',st.cls.id).order('created_at',{ascending:false}).limit(12);
  st.events=data||[];
}

/* ---------- main view ---------- */
function render(){
  const c=st.cls;
  $('#app').innerHTML=`<header><h1 class="logo">Money <span>Moves</span><small>FACILITATOR</small></h1>
    <div class="me"><span>${esc(st.user.email)}</span><button class="btn ghost sm" id="hOut">Log out</button></div></header>
  <div class="layout">
    <aside class="rail panel">
      <h2>CLASSES</h2>
      <div class="clist">${st.classes.length?st.classes.map(k=>`<button class="citem ${k.active?'':'off'}" data-cls="${k.id}" aria-current="${c&&c.id===k.id}"><span><b>${esc(k.code)}</b><small>${esc(k.name||'—')}${k.active?'':' · archived'}</small></span></button>`).join(''):'<div class="msg note">No classes yet. Create your first one below.</div>'}</div>
      <h2 style="margin-top:6px">NEW CLASS</h2>
      <div class="newcls">
        <div class="field"><label for="nCode">Class code students type</label><input id="nCode" maxlength="16" placeholder="TRIO-FALL" autocapitalize="characters"></div>
        <div class="field"><label for="nName">Name (only you see this)</label><input id="nName" maxlength="80" placeholder="Brooklyn College TRiO · Fall"></div>
        <button class="btn" id="nGo">Create class</button>
      </div>
    </aside>
    <section class="main">
      <div class="msg ${st.msg?st.msg.kind:''}" id="flash">${st.msg?esc(st.msg.text):''}</div>
      ${c?classView(c):'<div class="empty">Create a class to get a code your students can join with.</div>'}
    </section>
  </div>`;
  $('#hOut').onclick=logout;
  document.querySelectorAll('[data-cls]').forEach(b=>b.onclick=async()=>{st.cls=st.classes.find(k=>k.id===b.dataset.cls);st.pin={};st.confirm=null;st.msg=null;await refresh();});
  $('#nGo').onclick=createClass;
  if(c)bindClass();
}
function classView(c){
  const R=st.roster;const n=R.length;
  const avgMs=n?R.reduce((a,r)=>a+(r.p.milestones||0),0)/n:0;const fin=R.filter(r=>r.p.done).length;
  const active=R.filter(r=>r.last_seen&&Date.now()-Date.parse(r.last_seen)<15*60000).length;
  const avgBest=n?R.reduce((a,r)=>a+(r.p.best||0),0)/n:0;
  return`<div class="chead"><div><h3>${esc(c.code)}</h3><p>${esc(c.name||'')} ${c.active?'':'· archived (students can’t join)'} · Students join in the game with code <b style="font-family:var(--mono);color:var(--yellow)">${esc(c.code)}</b></p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="cBig">Big screen</button><button class="btn ghost" id="cArch">${c.active?'Archive class':'Reopen class'}</button></div></div>
  <div class="tiles"><div class="tile"><span>Students</span><b>${n}</b></div><div class="tile"><span>Active last 15 min</span><b>${active}</b></div><div class="tile"><span>Avg milestones</span><b>${avgMs.toFixed(1)}/${TOTAL}</b></div><div class="tile"><span>Finished</span><b>${fin}</b></div><div class="tile"><span>Avg best score</span><b>${num(avgBest)}</b></div></div>
  <div class="tabs"><button data-tab="roster" aria-pressed="${st.tab==='roster'}">Roster</button><button data-tab="events" aria-pressed="${st.tab==='events'}">Class events</button></div>
  ${st.tab==='roster'?rosterView():eventsView(c)}`;
}
function rosterView(){
  const f=st.filter.toLowerCase();
  const R=st.roster.filter(r=>!f||r.display_name.toLowerCase().includes(f)||r.username.includes(f));
  return`<div class="tools"><input id="rFind" placeholder="Find a student" value="${esc(st.filter)}" aria-label="Find a student"><div style="display:flex;gap:8px"><button class="btn ghost sm" id="rRef">Refresh</button><button class="btn ghost sm" id="rCsv">Export CSV</button></div></div>
  ${st.roster.length?`<div class="tablewrap"><table><thead><tr><th>Student</th><th>Progress</th><th class="num">Score</th><th class="num">Best</th><th class="num">Stars</th><th class="num">Runs</th><th>Last active</th><th>Manage</th></tr></thead><tbody>
  ${R.map(r=>{const p=r.p,ms=p.milestones||0,runs=(st.runs[r.user_id]||[]).length;const pin=st.pin[r.user_id];const conf=st.confirm===r.user_id;
    return`<tr><td><b>${esc(r.display_name)}</b><div class="sub">@${esc(r.username)} · ${r.lang==='es'?'Español':'English'}</div></td>
    <td><span class="bar"><i style="width:${ms/TOTAL*100}%"></i></span>${p.done?'<span class="pill g">DONE</span>':`<span class="sub">${ms}/${TOTAL} · ${tr_lv(ms)}</span>`}</td>
    <td class="num">${num(p.score)}</td><td class="num">${num(p.best)}</td><td class="num">${p.stars||0}/${TOTAL*3}</td><td class="num">${runs}</td>
    <td><span class="sub">${ago(r.last_seen)}</span></td>
    <td><div class="rowact">${pin!=null?`<input data-pinv="${r.user_id}" inputmode="numeric" maxlength="6" placeholder="New PIN" value="${esc(pin)}" aria-label="New PIN"><button class="btn sm" data-pinsave="${r.user_id}">Save</button><button class="btn ghost sm" data-pincancel="${r.user_id}">Cancel</button>`
      :conf?`<span class="sub">Delete login and all progress?</span><button class="btn red sm" data-rmyes="${r.user_id}">Remove</button><button class="btn ghost sm" data-rmno="1">Keep</button>`
      :`<button class="btn ghost sm" data-pin="${r.user_id}">Reset PIN</button><button class="btn ghost sm" data-rm="${r.user_id}">Remove</button>`}</div></td></tr>`;}).join('')}
  </tbody></table></div>`:`<div class="empty">No students yet. Share the class code <b style="font-family:var(--mono);color:var(--yellow)">${esc(st.cls.code)}</b>; students choose “Create account” in the game.</div>`}`;
}
function eventsView(c){
  return`<p class="msg note" style="margin:0">Sends an event to every student in ${esc(c.code)} who’s playing now (it reaches them within about 12 seconds). Players without accounts can type today’s code from the big screen.</p>
  <div class="evgrid">${EVENTS.map(([id,t,d])=>`<div class="ev"><b>${esc(t)}</b><p>${esc(d)}</p><p>Today’s code: <code>${classCode(id)}</code></p><button class="btn red sm" data-send="${id}" style="justify-self:start">Send to ${esc(c.code)}</button></div>`).join('')}</div>
  <h2>RECENTLY SENT</h2>
  <div class="hist">${st.events.length?st.events.map(e=>`<div>${esc((EVENTS.find(x=>x[0]===e.ev)||[0,e.ev])[1])} · ${ago(e.created_at)}</div>`).join(''):'<div>Nothing sent yet.</div>'}</div>`;
}
function bindClass(){
  $('#cBig').onclick=openBig;
  $('#cArch').onclick=async()=>{const {error}=await sb.from('classes').update({active:!st.cls.active}).eq('id',st.cls.id);if(error)flash(error.message,'bad');await refresh();};
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;render();});
  if(st.tab==='events'){
    document.querySelectorAll('[data-send]').forEach(b=>b.onclick=async()=>{b.disabled=true;const {error}=await sb.from('class_events').insert({class_id:st.cls.id,ev:b.dataset.send});
      if(error)flash('Couldn’t send: '+error.message,'bad');else flash(`Sent “${(EVENTS.find(x=>x[0]===b.dataset.send)||[])[1]}” to ${st.cls.code}.`,'ok');await loadEvents();render();});
    return;
  }
  const fi=$('#rFind');fi.oninput=()=>{st.filter=fi.value;const pos=fi.selectionStart;render();const f2=$('#rFind');f2.focus();f2.setSelectionRange(pos,pos);};
  $('#rRef').onclick=refresh;$('#rCsv').onclick=exportCsv;
  document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>{st.pin[b.dataset.pin]='';st.confirm=null;render();const i=document.querySelector(`[data-pinv="${b.dataset.pin}"]`);i&&i.focus();});
  document.querySelectorAll('[data-pinv]').forEach(i=>i.oninput=()=>{st.pin[i.dataset.pinv]=i.value.replace(/\D/g,'').slice(0,6);});
  document.querySelectorAll('[data-pincancel]').forEach(b=>b.onclick=()=>{delete st.pin[b.dataset.pincancel];render();});
  document.querySelectorAll('[data-pinsave]').forEach(b=>b.onclick=async()=>{const id=b.dataset.pinsave,pin=(st.pin[id]||'').trim();
    if(!/^\d{6}$/.test(pin)){flash('PINs are exactly 6 digits.','bad');return;}
    b.disabled=true;const r=await manage({action:'reset_pin',student_id:id,new_pin:pin});
    if(r.ok){const s=st.roster.find(x=>x.user_id===id);delete st.pin[id];flash(`PIN reset for ${s?s.display_name:'student'}. Tell them their new PIN: ${pin}`,'ok');render();}
    else{b.disabled=false;flash(r.error,'bad');}});
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{st.confirm=b.dataset.rm;st.pin={};render();});
  document.querySelectorAll('[data-rmno]').forEach(b=>b.onclick=()=>{st.confirm=null;render();});
  document.querySelectorAll('[data-rmyes]').forEach(b=>b.onclick=async()=>{b.disabled=true;const id=b.dataset.rmyes;const s=st.roster.find(x=>x.user_id===id);const r=await manage({action:'remove',student_id:id});
    st.confirm=null;if(r.ok){flash(`Removed ${s?s.display_name:'student'} and their progress.`,'ok');await refresh();}else{flash(r.error,'bad');render();}});
}
async function manage(body){
  try{const {data,error}=await sb.functions.invoke('manage-student',{body});
    if(error){let detail='';try{const j=await error.context.json();detail=j.error||'';}catch(e){}
      if(/not found|Failed to send|404/i.test(error.message+detail))return{error:'The manage-student function isn’t deployed yet (README, step 6).'};
      return{error:'Couldn’t do that: '+(detail||error.message)};}
    if(data&&data.ok)return{ok:true};return{error:'Couldn’t do that: '+((data&&data.error)||'unknown error')};
  }catch(e){return{error:'Couldn’t reach the server. Check your internet.'};}
}
async function createClass(){
  const code=$('#nCode').value.trim().toUpperCase().replace(/[^A-Z0-9-]/g,'');const name=$('#nName').value.trim();
  if(!/^[A-Z0-9-]{3,16}$/.test(code)){flash('Class codes are 3–16 letters, numbers, or dashes.','bad');return;}
  $('#nGo').disabled=true;
  const {data,error}=await sb.from('classes').insert({code,name,facilitator_id:st.user.id}).select('id,code,name,active,created_at').single();
  if(error){$('#nGo').disabled=false;flash(/duplicate|unique/i.test(error.message)?`The code ${code} is already taken. Try another.`:'Couldn’t create the class: '+error.message,'bad');return;}
  st.cls=data;flash(`Class ${code} created. Students join by choosing “Create account” in the game and typing ${code}.`,'ok');await refresh();
}
function exportCsv(){
  const rows=[['display_name','username','language','milestones','finished','score','best','stars','runs','last_active','joined']];
  st.roster.forEach(r=>rows.push([r.display_name,r.username,r.lang,r.p.milestones||0,r.p.done?'yes':'no',r.p.score||0,r.p.best||0,r.p.stars||0,(st.runs[r.user_id]||[]).length,r.last_seen||'',r.created_at||'']));
  const csv=rows.map(r=>r.map(v=>{const s=String(v);return/[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`money-moves-${st.cls.code}-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();
}

/* ---------- big screen ---------- */
let bigTimer=null;
async function paintBig(){
  const el=$('#big');if(el.hidden||!st.cls)return;
  const {data,error}=await sb.rpc('class_leaderboard',{p_class:st.cls.id});
  const rows=(data||[]).slice(0,15);
  el.innerHTML=`<div class="bw"><header><h1 class="logo">Money<span>Moves</span></h1><div class="join">Play at <b>${esc(location.host||'your site')}</b><br>Class code <b>${esc(st.cls.code)}</b></div></header>
  ${error?`<div class="empty">Couldn’t load the leaderboard.</div>`:rows.length?`<ol class="lb">${rows.map((r,i)=>`<li class="lbr ${i<3?'t'+(i+1):''}"><span class="rk">${i+1}</span><span class="nm">${esc(r.display_name)}</span><span class="pg"><i style="width:${(r.milestones||0)/TOTAL*100}%"></i></span><span class="ms">${r.done?TOTAL+'/'+TOTAL+' ✓':(r.milestones||0)+'/'+TOTAL}</span><b class="pt">${num(r.best)}</b></li>`).join('')}</ol>`:`<div class="empty">No scores yet. Students appear after their first milestone.</div>`}
  <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px"><span>Updates every 10 seconds${(data||[]).length>15?` · top 15 of ${data.length}`:''}</span><button class="btn ghost" id="bClose">Close</button></div></div>`;
  $('#bClose').onclick=closeBig;
}
function openBig(){$('#big').hidden=false;paintBig();clearInterval(bigTimer);bigTimer=setInterval(paintBig,10000);try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}}
function closeBig(){$('#big').hidden=true;clearInterval(bigTimer);try{document.fullscreenElement&&document.exitFullscreen();}catch(e){}}
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#big').hidden)closeBig();});

/* ---------- boot ---------- */
async function refresh(){await loadClasses();await Promise.all([loadRoster(),loadEvents()]);render();}
async function boot(){
  if(!sb){renderSetup();return;}
  const {data}=await sb.auth.getUser();
  if(!data||!data.user){renderLogin();return;}
  st.user=data.user;
  const {data:fac}=await sb.from('facilitators').select('user_id,name').eq('user_id',st.user.id).maybeSingle();
  if(!fac){renderNotFacilitator();return;}
  st.fac=fac;await refresh();
  clearInterval(st.timer);st.timer=setInterval(async()=>{if(st.tab==='roster'&&!Object.keys(st.pin).length&&!st.confirm&&document.activeElement.id!=='rFind'){await loadRoster();render();}},20000);
}
boot();
})();
</script>
</body>
