<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<title>Money Moves NYC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed canvas neighborhood; chunky transit-signage HUD floats over it. Single dark game UI by design. */
:root{
  --ink:#0E1326; --panel:rgba(16,21,42,.92); --panel-solid:#151B35; --panel-2:#1F2850; --line:#33407A;
  --cream:#F6F1E3; --muted:#A8B0D3; --dim:#6E77A3;
  --orange:#FF6319; --yellow:#FCCC0A; --yellow-d:#B98F00; --green:#18B45B; --blue:#3C78F0; --red:#F04848; --purple:#A066E0;
  --shadow:rgba(0,0,0,.4); --scrim:rgba(6,9,20,.72);
  --display:'Bungee','Arial Black',Impact,system-ui,sans-serif;
  --body:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--ink);color:var(--cream);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#hud{position:absolute;inset:0;pointer-events:none;padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
#hud > *{pointer-events:auto}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--shadow)}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.stats{padding:10px 12px;display:grid;gap:8px;width:340px;max-width:calc(100vw - 150px)}
.who{display:flex;align-items:center;gap:10px}
.who canvas{width:44px;height:44px;border-radius:50%;background:var(--panel-2);border:2px solid var(--yellow);flex:none}
.who .nm{font-family:var(--display);font-size:15px;line-height:1.1;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .ag{font-size:12px;color:var(--muted)}
.who .meta{min-width:0;flex:1}
.lvl{font-family:var(--display);font-size:11px;background:var(--yellow);color:var(--ink);border-radius:999px;padding:3px 8px;white-space:nowrap}
.xpbar{height:6px;border-radius:6px;background:var(--panel-2);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));width:0;transition:width .5s}
.money{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.money .sc b{color:var(--yellow)}
.money.five{grid-template-columns:repeat(5,1fr)}
.money.five b{font-size:13px}
.money div{display:flex;flex-direction:column;gap:1px;min-width:0}
.money span{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.money b{font-family:var(--mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.money b.pos{color:var(--green)}
.objective{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;max-width:min(460px,100%);align-self:flex-start;font-size:13px;line-height:1.35;cursor:pointer}
.objective .tag{font-family:var(--display);font-size:10px;background:var(--orange);color:var(--ink);border-radius:999px;padding:3px 8px;flex:none}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.icons{display:flex;gap:8px}
.ibtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--cream);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--shadow);font-family:var(--display);font-size:12px}
.ibtn:hover{border-color:var(--yellow)}
.ibtn:focus-visible,.btn:focus-visible,.choice:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.ibtn svg{width:20px;height:20px}
.ibtn{position:relative}
.ibtn .rkb{position:absolute;top:-7px;right:-9px;background:var(--orange);color:var(--ink);font:11px var(--display);border-radius:999px;padding:3px 6px;line-height:1;box-shadow:0 2px 0 var(--shadow)}
select{font:600 14px var(--body);background:var(--panel-2);color:var(--cream);border:2px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
.btn.sm{font-size:12px;padding:8px 14px}
.lbtools{justify-content:space-between}
.lbstat{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--muted)}
.lbstat i{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px;background:var(--dim)}
.lbstat.live i{background:var(--green);box-shadow:0 0 0 4px rgba(24,180,91,.2)}
.lbstat.off i,.lbstat.readonly i{background:var(--yellow)}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lbr{display:grid;grid-template-columns:30px minmax(0,1fr) 64px 40px 72px auto;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--panel-2)}
.lbr .rk{font-family:var(--display);font-size:15px;color:var(--muted);text-align:center}
.lbr.t1 .rk{color:var(--yellow)} .lbr.t2 .rk{color:#DCE1EE} .lbr.t3 .rk{color:#F0965A}
.lbr.t1{background:linear-gradient(90deg,rgba(252,204,10,.18),var(--panel-2) 60%)}
.lbr.me{outline:2px solid var(--yellow)}
.lbr .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr .cl{font-style:normal;font-size:10px;font-family:var(--display);color:var(--cream);background:var(--blue);border-radius:999px;padding:2px 7px;margin-left:8px;vertical-align:1px}
.lbr .you{font-style:normal;font-size:10px;font-family:var(--display);color:var(--ink);background:var(--yellow);border-radius:999px;padding:2px 7px;margin-left:8px;vertical-align:1px}
.lbr .pg{height:6px;border-radius:4px;background:var(--ink);overflow:hidden}
.lbr .pg i{display:block;height:100%;background:var(--green)}
.lbr .ms{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.lbr .ms.dn{color:var(--green)}
.lbr .pt{font-family:var(--mono);font-weight:500;text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
.lbr .del{font:11px var(--display);background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 8px;cursor:pointer}
.lbr .del.armed{background:var(--red);color:var(--cream);border-color:var(--red)}
.lbempty{padding:18px;text-align:center;color:var(--muted);background:var(--panel-2);border-radius:12px;font-size:14px;line-height:1.5}
.yours{background:var(--panel-2);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.yours summary{cursor:pointer;font-weight:600}
.yours summary b{font-family:var(--mono);color:var(--yellow);font-weight:500}
.yours[open] summary{margin-bottom:10px}
.bd{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.bd td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.bd td small{display:block;color:var(--muted);font-size:11.5px}
.bd td:last-child{text-align:right;font-family:var(--mono);white-space:nowrap;padding-left:12px}
.bd td.neg{color:var(--red)}
.bd tr.tot td{border-bottom:none;font-weight:700;color:var(--yellow);padding-top:8px}
.codebox{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;background:var(--ink);border-radius:12px;padding:10px 12px;border:1px dashed var(--line)}
.codebox span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.codebox b{font-family:var(--mono);font-size:22px;letter-spacing:.08em;color:var(--cream);-webkit-user-select:all;user-select:all}
.fac{display:grid;gap:10px;border-top:2px dashed var(--line);padding-top:14px}
.facgrid{display:grid;grid-template-columns:1.3fr .8fr 1fr auto;gap:8px}
.fac input,.fac textarea{font:500 14px var(--body);background:var(--panel-2);color:var(--cream);border:2px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
.fac textarea{resize:vertical;font-family:var(--mono);font-size:13px}
.fac input:focus,.fac textarea:focus{outline:none;border-color:var(--yellow)}
.fmsg{font-size:13px;line-height:1.45}
.fmsg .ok{color:var(--green)} .fmsg .bad{color:var(--red)}
.finalsc{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(90deg,rgba(252,204,10,.16),transparent);border:2px solid var(--yellow);border-radius:14px;padding:12px 16px}
.finalsc .big{font-family:var(--display);font-size:34px;color:var(--yellow);line-height:1}
.finalsc span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block}
/* big screen */
#board{position:absolute;inset:0;z-index:9;background:var(--ink);overflow-y:auto;padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:max(20px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-user-select:text;user-select:text}
#board .bwrap{max-width:1100px;margin:0 auto;display:grid;gap:18px}
#board header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
#board .logo{font-size:clamp(34px,6vw,64px)}
#board h2{font-family:var(--display);font-weight:400;font-size:clamp(18px,2.6vw,28px);margin:0 0 8px;color:var(--cream)}
#board .bh{display:grid;gap:6px;justify-items:end}
.lb.big{gap:10px}
.lb.big .lbr{grid-template-columns:64px minmax(0,1fr) minmax(80px,220px) 70px 150px;padding:14px 22px;border-radius:16px;font-size:clamp(17px,2.2vw,26px)}
.lb.big .lbr .rk{font-size:clamp(20px,2.6vw,32px)}
.lb.big .lbr .pt{font-size:clamp(20px,2.6vw,32px)}
.lb.big .lbr .ms{font-size:clamp(13px,1.5vw,18px)}
.lb.big .lbr .pg{height:10px}
.bfoot{color:var(--muted);font-size:14px;margin:0}

#mini{width:150px;height:111px;border-radius:10px;border:2px solid var(--line);background:var(--panel-solid);box-shadow:0 3px 0 var(--shadow)}
.spacer{flex:1}
/* touch controls */
#touch{display:none;justify-content:space-between;align-items:flex-end;pointer-events:none}
#touch > *{pointer-events:auto}
body.touch #touch{display:flex}
#stick{width:120px;height:120px;border-radius:50%;background:rgba(16,21,42,.55);border:2px solid var(--line);position:relative;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--panel-2);border:2px solid var(--yellow)}
#act{width:84px;height:84px;border-radius:50%;background:var(--yellow);color:var(--ink);border:none;font-family:var(--display);font-size:14px;box-shadow:0 5px 0 var(--yellow-d);touch-action:none}
#act:disabled{opacity:.35}
body.busy #touch{visibility:hidden}
/* dialogue */
#dlg{position:absolute;left:0;right:0;bottom:0;padding-bottom:max(14px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center;pointer-events:none}
#dlgBox{pointer-events:auto;width:100%;max-width:820px;display:grid;grid-template-columns:96px 1fr;gap:14px;padding:14px;background:var(--panel-solid);border:2px solid var(--line);border-radius:18px;box-shadow:0 6px 0 var(--shadow);cursor:pointer;animation:rise .18s ease-out}
#dlgBox.narr{grid-template-columns:1fr;background:var(--ink);border-style:dashed}
#dlgBox.narr #portraitWrap{display:none}
#dlgBox.narr #dlgText{font-style:italic;color:var(--muted)}
#portraitWrap{width:96px;height:96px;border-radius:14px;background:var(--panel-2);overflow:hidden;border:2px solid var(--line)}
#portrait{width:96px;height:96px;display:block}
.dlg-main{min-width:0;display:flex;flex-direction:column;gap:8px}
.dlg-name{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#dlgName{font-family:var(--display);font-size:16px;letter-spacing:.02em}
#dlgRole{font-size:12px;color:var(--muted)}
#dlgText{font-size:17px;line-height:1.5;margin:0;min-height:3em;max-width:68ch}
#dlgText .chip{display:inline-block;font-family:var(--display);font-size:11px;padding:2px 8px;border-radius:999px;margin-right:6px;vertical-align:2px}
.chip.ok{background:var(--green);color:var(--ink)} .chip.no{background:var(--red);color:var(--cream)}
#dlgChoices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:center;text-align:left;width:100%;font:500 15px/1.35 var(--body);color:var(--cream);background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.choice:hover{border-color:var(--yellow);background:#27325F}
.choice kbd{font-family:var(--mono);font-size:12px;background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--yellow);flex:none}
.qtimer{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.qtimer .bar{flex:1;height:7px;border-radius:5px;background:var(--panel-2);overflow:hidden}
.qtimer .bar i{display:block;height:100%;background:var(--green);border-radius:5px}
.qtimer.low .bar i{background:var(--red)} .qtimer.low{color:var(--red)}
.qtimer.mid .bar i{background:var(--yellow)}
.choice:disabled{opacity:.5;cursor:not-allowed}
.choice:disabled:hover{border-color:var(--line);background:var(--panel-2)}
.choice .why{display:block;font-size:12px;color:var(--yellow);margin-top:2px}
.choice .cost{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap;padding-left:8px}
.evopts{display:grid;gap:8px}
.evkind{display:inline-block;font-family:var(--display);font-size:11px;padding:3px 9px;border-radius:999px;color:var(--ink)}
.evbal{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.evbal b{font-family:var(--mono);color:var(--cream);font-weight:500}
.ptschip{font-family:var(--display);font-size:12px;border-radius:999px;padding:3px 10px;margin-right:6px}
.ptschip.g{background:var(--green);color:var(--ink)} .ptschip.m{background:var(--yellow);color:var(--ink)} .ptschip.b{background:var(--red);color:var(--cream)}
.codes{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--mono);font-size:12px}
.codes span{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:3px 7px}
.evtrig{display:grid;gap:8px}
.bigev{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--red);color:var(--cream);border-radius:16px;padding:14px 20px;font-size:clamp(15px,1.8vw,20px);animation:rise .3s ease-out}
.bigev b{font-family:var(--display);font-weight:400;font-size:clamp(18px,2.4vw,28px)}
.bigev .cd{margin-left:auto;background:var(--ink);border-radius:12px;padding:8px 14px;font-family:var(--mono);font-size:clamp(18px,2.4vw,30px);letter-spacing:.08em}
.bigev .cd small{display:block;font-family:var(--body);font-size:12px;letter-spacing:0;color:var(--muted)}
.bigadmin{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#social{position:absolute;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));width:min(560px,calc(100vw - 32px));background:var(--panel-solid);border:2px solid var(--line);border-radius:18px;box-shadow:0 6px 0 var(--shadow);padding:12px 14px;display:grid;gap:10px;z-index:4;animation:rise .18s ease-out}
body.touch #social{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
body.busy #social{display:none}
#social .shead{display:flex;justify-content:space-between;align-items:center;gap:10px}
#social .shead b{font-family:var(--display);font-size:13px;letter-spacing:.04em}
#social .sx{background:transparent;border:none;color:var(--muted);font:14px var(--display);cursor:pointer;padding:4px 8px}
.mates{display:flex;flex-wrap:wrap;gap:6px}
.mate{font-size:12.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.mate i{font-style:normal;color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:5px}
.emos{display:flex;gap:6px;flex-wrap:wrap}
.emos button{font-size:22px;width:46px;height:42px;border-radius:12px;background:var(--panel-2);border:2px solid var(--line);cursor:pointer;line-height:1}
.phr{display:flex;gap:6px;flex-wrap:wrap}
.phr button{font:500 13px var(--body);color:var(--cream);background:var(--panel-2);border:2px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer}
.emos button:hover,.phr button:hover{border-color:var(--yellow)}
.emos button:disabled,.phr button:disabled{opacity:.4;cursor:not-allowed}
.snote{font-size:12.5px;color:var(--muted);line-height:1.45}
#hi{position:absolute;bottom:-4px;right:-4px}
#act.hf{background:var(--blue);color:var(--cream);box-shadow:0 5px 0 #23468F}
.auth{display:grid;gap:12px}
.auth .tabs{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;justify-self:start}
.auth .tabs button{font-family:var(--display);font-size:12px;background:transparent;color:var(--muted);border:none;padding:8px 14px;cursor:pointer}
.auth .tabs button[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
.auth .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.auth .err{color:var(--red);font-size:13.5px;line-height:1.45;min-height:1em}
.auth .who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.auth .who b{color:var(--cream)}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;font:13px var(--body);cursor:pointer;padding:0;justify-self:start}
.acct{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--panel-2);border-radius:12px;padding:10px 12px;font-size:13.5px}
.acct .ok{color:var(--green)} .acct .bad{color:var(--red)}
@media (max-width:560px){.auth .grid{grid-template-columns:1fr}}
#dlgNext{align-self:flex-end;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
#dlgNext b{color:var(--yellow);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
@keyframes rise{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}
/* modal */
#modal{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:7}
.modal-card{width:100%;max-width:580px;max-height:100%;overflow-y:auto;background:var(--panel-solid);border:2px solid var(--line);border-radius:20px;box-shadow:0 8px 0 var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px;animation:rise .2s ease-out;-webkit-user-select:text;user-select:text}
.modal-card.wide{max-width:720px}
.eyebrow{font-family:var(--display);font-size:11px;letter-spacing:.12em;color:var(--orange)}
.modal-card h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15;margin:0;text-wrap:balance}
.modal-card p{margin:0;line-height:1.55;color:var(--cream)}
.modal-card .sub{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.btn{font-family:var(--display);font-size:14px;letter-spacing:.03em;background:var(--yellow);color:var(--ink);border:none;border-radius:999px;padding:12px 20px;cursor:pointer;box-shadow:0 4px 0 var(--yellow-d)}

/* ================= player ================= */
const P={x:8.5*T,y:8.5*T,dir:'d',phase:0,moving:false,path:null,pend:null,stuck:0};
function canStand(x,y){const r=8;for(const[dx,dy]of[[-r,-5],[r,-5],[-r,4],[r,4]]){if(isSolid(Math.floor((x+dx)/T),Math.floor((y+dy)/T)))return false;}return true;}
function bfs(sx,sy,tx,ty,allowTarget){
  if(sx===tx&&sy===ty)return[];
  const prev=new Int32Array(MW*MH).fill(-1),q=[ti(sx,sy)];prev[ti(sx,sy)]=ti(sx,sy);
  const tgt=ti(tx,ty);
  for(let h=0;h<q.length;h++){const i=q[h];if(i===tgt)break;const x=i%MW,y=(i/MW)|0;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const ni=ti(nx,ny);if(prev[ni]!==-1)continue;if(isSolid(nx,ny)&&!(allowTarget&&ni===tgt))continue;prev[ni]=i;q.push(ni);}}
  if(prev[tgt]===-1)return null;
  const path=[];let i=tgt;while(i!==ti(sx,sy)){path.push(i);i=prev[i];}path.reverse();
  return path.map(i=>({x:(i%MW)*T+T/2,y:((i/MW)|0)*T+T/2+4}));

function clearLine(ax,ay,bx,by){const d=Math.hypot(bx-ax,by-ay),n=Math.ceil(d/8);for(let k=1;k<=n;k++){const x=ax+(bx-ax)*k/n,y=ay+(by-ay)*k/n;if(!canStand(x,y))return false;}return true;}

  const tx=Math.floor(wx/T),ty=Math.floor(wy/T);let target=null;
  for(const id of WORLD_NPCS){if(!npcVisible(id))continue;const n=NPCS[id];if(Math.floor(n.x)===tx&&Math.floor(n.y)===ty){target=id;break;}}
  const sx=Math.floor(P.x/T),sy=Math.floor(P.y/T);
  let path;
  if(target){
    if(Math.hypot(NPCS[target].x*T-P.x,NPCS[target].y*T-P.y)<50){talkTo(target);return;}
    path=bfs(sx,sy,tx,ty,true);if(path&&path.length)path.pop();P.pend=target;
  }else{if(isSolid(tx,ty))return;path=bfs(sx,sy,tx,ty,false);P.pend=null;}
  if(path){P.path=path;P.stuck=0;}
}

/* ================= update ================= */
let busy=false, nearNpc=null, floats=[], tAll=0;

function update(dt){
  tAll+=dt;
  // player
  let vx=0,vy=0;
  if(!paused()){
    if(keys.has('arrowleft')||keys.has('a'))vx-=1; if(keys.has('arrowright')||keys.has('d'))vx+=1;
    if(keys.has('arrowup')||keys.has('w'))vy-=1; if(keys.has('arrowdown')||keys.has('s'))vy+=1;
    if(stick.on){vx=stick.x;vy=stick.y;}
    if(vx||vy){P.path=null;P.pend=null;}

      // string-pull
      while(P.path.length>1&&clearLine(P.x,P.y,P.path[1].x,P.path[1].y))P.path.shift();
      const wp=P.path[0],dx=wp.x-P.x,dy=wp.y-P.y,d=Math.hypot(dx,dy);
      if(d<4){P.path.shift();if(!P.path.length){P.path=null;if(P.pend){const id=P.pend;P.pend=null;talkTo(id);}}}

    }

    if(canStand(P.x+vx*dt,P.y))P.x+=vx*dt; if(canStand(P.x,P.y+vy*dt))P.y+=vy*dt;

    if(P.path){if(Math.hypot(P.x-ox,P.y-oy)<.3){P.stuck+=dt;if(P.stuck>.5){P.path=null;P.pend=null;}}else P.stuck=0;}
  }else{P.moving=false;}
  // nearby npc
  nearNpc=null;let best=52;
  for(const id of WORLD_NPCS){if(!npcVisible(id))continue;const n=NPCS[id];const d=Math.hypot(n.x*T-P.x,n.y*T-P.y);if(d<best){best=d;nearNpc=id;}}
  updateMates(dt);

    if(overlap(ahead,pr)||overlap(carRect(c,14),pr))block=true;
    for(const p of peds)if(overlap(ahead,{x:p.x-8,y:p.y-12,w:16,h:14}))block=true;
    if(c.axis==='v')for(const o of cars){if(o.axis==='h'&&overlap(carRect(c,30),carRect(o,0)))block=true;}

    if(!p.path||!p.path.length){const t=walkTiles[Math.floor(Math.random()*walkTiles.length)];const pth=bfs(Math.floor(p.x/T),Math.floor(p.y/T),t[0],t[1],false);p.path=pth&&pth.length<40?pth:null;p.wait=1+Math.random()*2.5;continue;}

  if(!$('#title').hidden){tx=20*T+Math.sin(tAll*.08)*9*T;ty=15*T+Math.cos(tAll*.06)*6*T;}
  cam.x+=(tx-cam.x)*Math.min(1,dt*(($('#title').hidden)?6:1));cam.y+=(ty-cam.y)*Math.min(1,dt*(($('#title').hidden)?6:1));

}
function respawnPigeon(g){for(let k=0;k<20;k++){const t=walkTiles[Math.floor(Math.random()*walkTiles.length)];const x=t[0]*T+8+Math.random()*16,y=t[1]*T+8+Math.random()*16;if(Math.hypot(x-P.x,y-P.y)>200){Object.assign(g,{x,y,z:0,fly:0,t:0,next:1});return;}}g.fly=-2;}

async function quiz(npc,t,opts,explain){

  const sh=shuffle(opts.slice());
  const QM=quizMs(),timed=S.timer!==false?QM:0;
  const i=await showLine(npc,t,sh.map(o=>o.t),null,timed);
  const timeout=i<0,ok=!timeout&&!!sh[i].ok;

  S.quizT++;S.quizPts=(S.quizPts||0)+pts;

    :`<h2>${tr(L('Your score after 4 months','Tu puntaje después de 4 meses'))}: ${score}</h2>

function fvSeries(monthly,start){const r=.07/12;const out=[];let v=0;for(let age=18;age<=65;age++){out.push(v);if(age>=start)for(let k=0;k<12;k++)v=v*(1+r)+monthly;}out[out.length-1]=v;return out;}
function compoundModal(){return new Promise(res=>{let amt=50;

    const a=fvSeries(amt,18),b=fvSeries(amt,28);const max=Math.max(1000,a[a.length-1]);const step=[1e3,5e3,1e4,25e3,5e4,1e5,2.5e5,5e5,1e6,2e6,5e6].find(s=>max/s<=5)||1e6;const top=Math.ceil(max/step)*step;
    const padL=58,padR=14,padT=14,padB=26;const X=age=>padL+(age-18)/(65-18)*(w-padL-padR),Y=v=>h-padB-v/top*(h-padT-padB);
    c.font='11px DM Mono, monospace';c.fillStyle='#A8B0D3';c.strokeStyle='rgba(168,176,211,.15)';c.lineWidth=1;c.textAlign='right';c.textBaseline='middle';
    for(let v=0;v<=top;v+=step){c.beginPath();c.moveTo(padL,Y(v));c.lineTo(w-padR,Y(v));c.stroke();c.fillText(v>=1e6?'$'+(v/1e6)+'M':v>=1e3?'$'+(v/1e3)+'k':'$'+v,padL-6,Y(v));}
    c.textAlign='center';c.textBaseline='top';for(const ag of [18,28,40,50,65])c.fillText(ag,X(ag),h-padB+6);
    const line=(arr,col)=>{c.beginPath();arr.forEach((v,k)=>{const x=X(18+k),y=Y(v);k?c.lineTo(x,y):c.moveTo(x,y);});c.strokeStyle=col;c.lineWidth=3;c.stroke();const g=c.createLinearGradient(0,padT,0,h-padB);g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');c.lineTo(X(65),Y(0));c.lineTo(X(18),Y(0));c.fillStyle=g;c.fill();c.fillStyle=col;c.beginPath();c.arc(X(65),Y(arr[arr.length-1]),4.5,0,7);c.fill();};
    line(b,'#3C78F0');line(a,'#FCCC0A');};
  const nums=()=>{const a=fvSeries(amt,18).pop(),b=fvSeries(amt,28).pop();$('#cAmt').textContent=fmt(amt)+tr(L('/month','/mes'));

  openModal(()=>{
    mc.innerHTML=`<div class="eyebrow">${tr(L('ROTH IRA · INDEX FUND','ROTH IRA · FONDO INDEXADO'))}</div><h2>${tr(L('Start at 18 or start at 28?','¿Empezar a los 18 o a los 28?'))}</h2>

    <div class="tile"><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--blue);margin-right:5px"></i>${tr(L('Start at 28 → value at 65','Empezar a los 28 → valor a los 65'))}</span><b id="cB"></b><small id="cBc"></small></div></div>
    <p class="sub" style="font-size:12.5px">${tr(L('Assumes a 7% average yearly return, compounded monthly. Real markets go up and down, and returns are not guaranteed.','Supone un rendimiento promedio de 7% anual, compuesto mensualmente. Los mercados reales suben y bajan, y los rendimientos no están garantizados.'))}</p>
    <div class="row end"><button class="btn" id="cGo"></button></div>`;
    $('#cR').oninput=e=>{amt=+e.target.value;nums();};$('#cGo').onclick=()=>{closeModal();res(amt);};requestAnimationFrame(nums);
  },'wide');});}

async function completeQuest(){
  const q=QUESTS[S.q];const st=clamp(S.stars[q.id]||1,1,3);S.stars[q.id]=st;
  sfx('badge');await badgeModal(q,st);addXP(30+st*15);
  S.q++;S.step=0;
  if(S.q>=QUESTS.length){S.done=true;save();updateHUD();postScore();await reportCard();return;}
  const prevLv=q.lvl,nx=QUESTS[S.q];
  if(nx.lvl!==prevLv){save();postScore();await levelReportModal(prevLv);await enterLevel(nx.lvl);}
  const months=(nx.when[0]*12+nx.when[1])-(S.age*12+S.mon);
  if(months>0){
    const before=S.savings;const acc={earned:0,saved:0,extra:0,cardInt:0,loanInt:0,k401:0,short:0,toCard:0,jobless:false};const notes=[];
    const simLv=prevLv===nx.lvl?prevLv:prevLv;
    for(let k=0;k<months;k++)monthTick(simLv,acc);
    S.savings=+S.savings.toFixed(2);S.cash=+S.cash.toFixed(2);S.interestEarned+=acc.earned;S.interestPaid+=acc.cardInt;S.cardBal=+S.cardBal.toFixed(2);S.loanInt=(S.loanInt||0)+acc.loanInt;
    if(simLv===1&&acc.saved)notes.push(L(`Your budget moved ${fmt(acc.saved)} into savings automatically (${fmt(S.monthlySave)} a month).`,`Tu presupuesto pasó ${fmt(acc.saved)} a ahorros automáticamente (${fmt(S.monthlySave)} al mes).`));
    if(simLv===1&&acc.extra>0)notes.push(L(`Your higher wage left an extra ${fmt(acc.extra)} in your spending account.`,`Tu salario más alto dejó ${fmt(acc.extra)} extra en tu cuenta para gastar.`));
    if(simLv>1&&acc.saved)notes.push(L(`Automatic savings moved ${fmt(acc.saved)} out of your paychecks.`,`El ahorro automático apartó ${fmt(acc.saved)} de tus sueldos.`));
    if(acc.short>0)notes.push(L(`Your bills were bigger than your income by ${fmt(acc.short)} over this stretch.${acc.toCard>0?` ${fmt(acc.toCard)} of it ended up on your credit card.`:''}`,`Tus gastos superaron tus ingresos por ${fmt(acc.short)} en este periodo.${acc.toCard>0?` ${fmt(acc.toCard)} terminaron en tu tarjeta.`:''}`));
    if(simLv===2)notes.push(L(`Student loans so far: ${fmt(ownDebt())} in your name.`,`Préstamos hasta ahora: ${fmt(ownDebt())} a tu nombre.`));
    if(simLv===3&&acc.k401>0)notes.push(L(`You and your employer added ${fmt(acc.k401)} to your 401(k). Balance: ${fmt(S.k401bal)}.`,`Tú y tu empresa sumaron ${fmt(acc.k401)} a tu 401(k). Saldo: ${fmt(S.k401bal)}.`));
    if(simLv===3)notes.push(L(`Student loans left: ${fmt(ownDebt())}.`,`Préstamos restantes: ${fmt(ownDebt())}.`));
    if(acc.jobless)notes.push(L('Part of this stretch you were between jobs.','Parte de este tiempo estuviste sin trabajo.'));
    if(acc.cardInt>0)notes.push(L(`Your card balance grew by ${fmt(acc.cardInt,1)} in interest.`,`El saldo de tu tarjeta creció ${fmt(acc.cardInt,1)} en intereses.`));
    if(simLv===1)notes.push(L('Interest is small at first. It grows as your balance grows. That is compounding.','Al principio los intereses son pequeños. Crecen a medida que crece tu saldo. Eso es el interés compuesto.'));
    S.age=nx.when[0];S.mon=nx.when[1];updateHUD();
    await timeSkipModal(months,notes,before,acc.earned);
  }else{S.age=nx.when[0];S.mon=nx.when[1];}
  if(nx.lvl===1){const evIdx=S.q-2;if(evIdx>=0&&evIdx<6&&!(S.evLog||[]).includes('r'+evIdx)){const id=eventOrder()[evIdx];const ev=EVENTS.find(e=>e.id===id);if(ev){S.evLog.push('r'+evIdx);await eventModal(ev,L(`LIFE HAPPENS · ${evIdx+1}/6`,`ASÍ ES LA VIDA · ${evIdx+1}/6`));}}}
  else{const li=QUESTS.filter(x=>x.lvl===nx.lvl).indexOf(nx),key='r'+nx.lvl+'-'+li;
    if(li>=1&&li<=5&&!(S.evLog||[]).includes(key)){const id=eventOrderLv(nx.lvl)[li-1];const ev=(nx.lvl===2?EVENTS_L2:EVENTS_L3).find(e=>e.id===id);if(ev){S.evLog.push(key);await eventModal(ev,L(`LIFE HAPPENS · ${li}/5`,`ASÍ ES LA VIDA · ${li}/5`));}}}
  save();updateHUD();postScore();toast(tr(nx.steps[0].obj),'blue');
}

   LEVELS 2 & 3 — college town and the big city

const LEVEL_INFO={
  1:{title:L('Level 1 · The Block','Nivel 1 · El Barrio'),ages:'16–18',color:'#FF6319'},
  2:{title:L('Level 2 · College Town','Nivel 2 · Pueblo Universitario'),ages:'18–22',color:'#C8102E'},
  3:{title:L('Level 3 · The Big City','Nivel 3 · La Gran Ciudad'),ages:'22–26',color:'#14A3A3'},
};
const RATE={fed:.0639,plus:.0894,priv:.11};
const hasSv=n=>()=>S.savings>=n;const noSv=L('Not enough in savings','No tienes suficiente en ahorros');
function pmt(bal,rate,months){if(bal<=0)return 0;const r=rate/12;return bal*r/(1-Math.pow(1+r,-months));}
function ensureDebt(){if(!S.debt)S.debt={sub:0,unsub:0,priv:0,plus:0};return S.debt;}
function ownDebt(s){s=s||S;const d=s.debt||{};return (d.sub||0)+(d.unsub||0)+(d.priv||0);}
function netWorth(s){s=s||S;return (s.cash||0)+(s.savings||0)+(s.deposit||0)+(s.k401bal||0)+(s.brokerage||0)+(s.crypto||0)-(s.cardBal||0)-ownDebt(s);}
function gpaFmt(){return (S.gpa||3).toFixed(2);}
function careerScore(){return Math.max(0,((S.gpa||3)-2.8)*5)+(S.certified?1.5:0)+(S.research?2:0)+(S.job2==='lib'?0.5:0)+(S.intern==='bank'?3:S.intern==='startup'?1.5:S.intern==='camp'?0.5:0);}
function expectedSalary(){return Math.round(clamp(54000+careerScore()*2500,52000,74000)/500)*500;}
function cutBorrowing(perYear){const a=S.aid;if(!a)return 0;let left=perYear;for(const k of ['priv','plus','unsub','sub']){const x=Math.min(left,a[k]||0);a[k]-=x;left-=x;}return perYear-left;}
function quizMs(){const lv=curLvl();return lv===3?15000:lv===2?20000:25000;}

/* ---------- monthly simulation (all levels) ---------- */
function flow(net,acc){
  if(net>=0){const sv=net*(S.saveRate==null?.15:S.saveRate);S.savings+=sv;S.cash+=net-sv;acc.saved+=sv;acc.extra+=net-sv;}
  else{S.cash+=net;acc.short+=-net;if(S.cash<0){S.savings+=S.cash;S.cash=0;if(S.savings<0){acc.toCard+=-S.savings;S.cardBal+=-S.savings;S.savings=0;}}}
}
function payCardFromCash(){if(S.cardBal>0&&S.cash>0){const x=Math.min(S.cash,S.cardBal);S.cash-=x;S.cardBal-=x;}}
function monthTick(lv,acc){
  const int=S.savings*.04/12;S.savings+=int;acc.earned+=int;
  if(S.cardBal>0){const ci=S.cardBal*(S.cardApr||.2799)/12;S.cardBal+=ci;acc.cardInt+=ci;}
  if(lv===1){
    if(S.budget){S.savings+=S.monthlySave;acc.saved+=S.monthlySave;const inc=S.wage>17?Math.round(S.wage*40*.882):600;S.cash+=inc-600;acc.extra+=inc-600;}
    return;
  }
  const d=ensureDebt();
  if(lv===2){
    flow((S.l2inc||350)-(320+(S.housingMo||0)+(S.l2extra||0)),acc);payCardFromCash();
    const a=S.aid||{},f=(S.aidYears||4)/4/12;
    for(const k of ['sub','unsub','priv','plus'])d[k]+=(a[k]||0)*f;
    for(const[k,r]of[['unsub',RATE.fed],['priv',RATE.priv],['plus',RATE.plus]]){const i=d[k]*r/12;d[k]+=i;acc.loanInt+=i;}
    return;
  }
  // level 3
  const gross=(S.salary||0)/12,k=S.k401pct||0;
  let take=gross*(1-k)*.71;if(S.unemployed>0){take=1650;S.unemployed--;acc.jobless=true;}
  flow(take-((S.rent||1250)+680+(S.healthCost||0)+(S.loanPay||0)+(S.carCost||0)+(S.lifestyle||0)+(S.famPay||0)),acc);payCardFromCash();
  if(!acc.jobless){const c=gross*(k+Math.min(k,S.match||0));S.k401bal=(S.k401bal||0)+c;acc.k401+=c;}
  S.k401bal=(S.k401bal||0)*(1+.07/12);S.brokerage=(S.brokerage||0)*(1+.07/12);
  for(const[key,r]of[['priv',RATE.priv],['sub',RATE.fed],['unsub',RATE.fed]]){const i=d[key]*r/12;d[key]+=i;acc.loanInt+=i;}
  let pay=(S.loanPay||0)+(S.extraLoan||0);
  for(const key of (S.avalanche?['priv','unsub','sub']:['sub','unsub','priv'])){const x=Math.min(pay,d[key]);d[key]-=x;pay-=x;}
  if(d.plus>0){d.plus+=d.plus*RATE.plus/12;d.plus=Math.max(0,d.plus-150-(S.famPay||0));}
}

/* ---------- generic allocation modal (exact cover with sliders) ---------- */
function allocModal(o){return new Promise(res=>{
  const v={};o.rows.forEach(r=>v[r.k]=r.v||0);
  const sum=()=>o.rows.reduce((a,r)=>a+v[r.k],0);
  const paint=()=>{const left=o.target-sum();const el=$('#alLeft');el.className='left '+(left===0?'ok':left<0?'over':'under');
    el.textContent=left===0?tr(o.okText||L('Every dollar is covered','Cada dólar está cubierto')):left>0?`${tr(L('Still to cover','Falta cubrir'))}: ${fmt(left)}`:`${tr(L('Over by','Te pasaste por'))} ${fmt(-left)}`;
    $('#alInfo').innerHTML=o.info?o.info(v):'';$('#alInfo').hidden=!o.info;$('#alOk').disabled=left!==0;};
  openModal(()=>{
    mc.innerHTML=`<div class="eyebrow">${tr(o.eyebrow)}</div><h2>${tr(o.title)}</h2>${o.sub?`<div class="sub">${o.sub()}</div>`:''}
    <div class="bud">${o.rows.map(r=>`<div class="it"><label for="al_${r.k}">${tr(r.n)}</label><output id="ao_${r.k}">${fmt(v[r.k])}</output><small>${tr(r.h)}</small><input type="range" id="al_${r.k}" min="0" max="${Math.max(0,r.max)}" step="${r.step||o.step||250}" value="${v[r.k]}" ${r.max<=0?'disabled':''}></div>`).join('')}</div>
    <div class="left" id="alLeft"></div><div class="callout" id="alInfo"></div>
    <div class="row end"><button class="btn" id="alOk">${tr(o.btn)}</button></div>`;
    o.rows.forEach(r=>{$('#al_'+r.k).oninput=e=>{v[r.k]=+e.target.value;$('#ao_'+r.k).textContent=fmt(v[r.k]);paint();};});
    $('#alOk').onclick=()=>{closeModal();res(v);};paint();
  },'wide');});}
function infoModal(eyebrow,title,html,btn){return new Promise(res=>{openModal(()=>{
  mc.innerHTML=`<div class="eyebrow">${tr(eyebrow)}</div><h2>${tr(title)}</h2>${html()}<div class="row end"><button class="btn" id="imOk">${tr(btn||UI.cont)}</button></div>`;
  $('#imOk').onclick=()=>{closeModal();res();};},'wide');});}
const tbl=rows=>`<table class="bd">${rows.map(r=>`<tr${r[2]?` class="${r[2]}"`:''}><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
function grade(diff,a,b){return diff<=a?3:diff<=b?2:1;}

function eventOrderLv(lv){const deck=lv===2?EVENTS_L2:EVENTS_L3;return shuffle(deck.map(e=>e.id),rng('ev'+lv+'|'+(S.seed||'x'))).slice(0,5);}

/* ---------- level transitions ---------- */
function levelStars(lv){return QUESTS.filter(q=>q.lvl===lv).reduce((a,q)=>a+(S.stars[q.id]||0),0);}
function levelReportModal(lv){return new Promise(res=>{openModal(()=>{
  const qs=QUESTS.filter(q=>q.lvl===lv);const st=levelStars(lv);
  mc.innerHTML=`<div class="center" style="display:flex;flex-direction:column;gap:12px"><div class="eyebrow">${tr(L('LEVEL COMPLETE','NIVEL COMPLETADO'))}</div>
  <div class="badge" style="background:${LEVEL_INFO[lv].color}">${lv}</div><h2>${tr(LEVEL_INFO[lv].title)}</h2><p class="sub">${st}/${qs.length*3} ★ · ${tr(L('Score so far','Puntaje hasta ahora'))}: <b>${num(computeScore().total)}</b></p></div>
  <div class="grid2"><div class="tile"><span>${tr(L('Net worth','Patrimonio neto'))}</span><b>${fmt(netWorth())}</b></div><div class="tile"><span>${tr(L('Credit score','Puntaje de crédito'))}</span><b>${S.credit||'—'}</b></div>${lv>=2?`<div class="tile"><span>${tr(L('Student loans','Préstamos estudiantiles'))}</span><b>${fmt(ownDebt())}</b></div><div class="tile"><span>GPA</span><b>${gpaFmt()}</b></div>`:''}</div>
  <div class="ms">${qs.map(q=>`<div class="m"><div class="bullet" style="background:${q.color}">${QUESTS.indexOf(q)+1}</div><div><div class="t">${tr(q.title)}</div><div class="d">${tr(q.take)}</div></div><div>${stars(S.stars[q.id]||0)}</div></div>`).join('')}</div>
  <div class="callout">${lv===1?tr(L('Next: <b>Level 2 · College Town</b>. You’re 18 and headed to Riverside State in Maple Falls. Bigger money, fewer obvious answers, and a shorter quiz clock (20 seconds).','Siguiente: <b>Nivel 2 · Pueblo Universitario</b>. Tienes 18 y vas a Riverside State en Maple Falls. Más dinero, menos respuestas obvias y menos tiempo en las preguntas (20 segundos).'))
    :tr(L('Next: <b>Level 3 · The Big City</b>. You’re 22 with a degree and a job search in Manhattan. Your loans, credit, and habits come with you. Quiz clock: 15 seconds.','Siguiente: <b>Nivel 3 · La Gran Ciudad</b>. Tienes 22, un título y buscas trabajo en Manhattan. Tus préstamos, crédito y hábitos vienen contigo. Tiempo por pregunta: 15 segundos.'))}</div>
  <div class="row end"><button class="btn" id="lvGo">${lv===1?tr(L('Head to college','Ir a la universidad')):tr(L('Move to the city','Mudarme a la ciudad'))}</button></div>`;
  $('#lvGo').onclick=()=>{closeModal();res();};},'wide');});}
async function enterLevel(lv){
  if(!S.lvSeen)S.lvSeen=[1];
  if(S.lvSeen.includes(lv))return;
  S.lvSeen.push(lv);
  if(lv===2){S.gpa=S.gpa||(3.1+(S.certified?.1:0));ensureDebt();S.l2inc=S.l2inc||350;if(S.saveRate==null)S.saveRate=S.budget?Math.min(.3,S.monthlySave/600):.1;}
  if(lv===3){S.degree=true;S.loanPay=S.loanPay||Math.round(pmt(ownDebt(),RATE.fed,120));S.k401bal=S.k401bal||0;S.brokerage=S.brokerage||0;S.rent=S.rent||500;}
  loadLevel(lv);spawnPlayer();
  sfx('badge');
  await infoModal(L('NEW LEVEL','NUEVO NIVEL'),LEVEL_INFO[lv].title,()=>`<p>${lv===2?tr(L('Maple Falls is a small college town upstate, home of Riverside State. Leaves are turning, rent is cheaper than the city, and every choice now involves thousands of dollars and four years of consequences.','Maple Falls es un pueblo universitario al norte del estado, sede de Riverside State. Las hojas cambian de color, la renta es más barata que en la ciudad, y cada decisión ahora involucra miles de dólares y cuatro años de consecuencias.'))
    :tr(L('Midtown Manhattan. Glass towers, yellow cabs, and the highest rents in the country. Your student loans start soon. Two companies want you. Everyone has an opinion about what you should do with your money.','Midtown, Manhattan. Torres de vidrio, taxis amarillos y las rentas más altas del país. Tus préstamos empiezan pronto. Dos empresas te quieren. Todos opinan sobre qué hacer con tu dinero.'))}</p>
    <p class="sub">${tr(L('Your money, credit score, and choices carry over. Decisions now have trade-offs, and the best answer depends on your situation.','Tu dinero, crédito y decisiones continúan. Ahora las decisiones tienen pros y contras, y la mejor respuesta depende de tu situación.'))}</p>`,L('Let’s go','Vamos'));
  updateHUD();save();postScore();joinClassRoom();
}

let lastScore=null;
const num=n=>new Intl.NumberFormat(lang()==='es'?'es-US':'en-US').format(Math.round(n));
function computeScore(s){
  s=s||S;
  const starsN=QUESTS.reduce((a,q,i)=>a+(i<s.q?(s.stars[q.id]||0):0),0);
  const nw=netWorth(s);const ret=Math.min(1200,(s.ira||0)*2+((s.match||0)>0&&(s.k401pct||0)>=(s.match||0)?250:0)+Math.floor(((s.k401bal||0)+(s.brokerage||0))/200));
  const plus=s.debt&&s.debt.plus>0?Math.min(500,Math.round(s.debt.plus/50)):0;
  const parts=[
    {n:L('Milestone stars','Estrellas de metas'),v:starsN*100,d:`${starsN} ★ × 100`},
    {n:L('Quiz points','Puntos de preguntas'),v:s.quizPts!=null?s.quizPts:s.quizR*50,d:`${s.quizR}/${s.quizT} ${tr(L('correct · faster = more','correctas · más rápido = más'))}`},
    {n:L('Life events','Eventos de la vida'),v:s.evPts||0,d:`${s.evN||0} ${tr(L('decisions','decisiones'))}`},
    {n:L('Net worth','Patrimonio neto'),v:s.degree?Math.round(clamp(nw/10,-500,1500)):Math.round(clamp(nw/8,0,600)),d:s.degree?`${fmt(nw)} ÷ 10, ${tr(L('−500 to 1,500','−500 a 1,500'))}`:`${fmt(nw)} ÷ 8, ${tr(L('max','máx.'))} 600`},
    {n:L('Credit score','Puntaje de crédito'),v:s.credit?Math.max(0,Math.min(850,s.credit)-600)*3:0,d:s.credit?`(${s.credit} − 600) × 3`:tr(L('Unlocks at milestone 7','Se desbloquea en la meta 7'))},
    {n:L('Skills certificate','Certificado de habilidades'),v:s.certified?200:0,d:s.certified?'+200':tr(L('Milestone 6 choice','Decisión de la meta 6'))},
    {n:L('Investing & retirement','Inversión y retiro'),v:ret,d:tr(L('IRA plan, full 401(k) match, balances · max 1,200','Plan IRA, aporte completo del 401(k), saldos · máx. 1,200'))},
    {n:L('Mamá’s Parent PLUS debt','Deuda Parent PLUS de Mamá'),v:-plus,d:plus?`−1 / $50`:tr(L('None','Ninguna'))},
    {n:L('Fees & card interest paid','Cargos e intereses de tarjeta'),v:-Math.min(2500,Math.round((s.fees+s.interestPaid)*(s.degree?1:2))),d:s.degree?tr(L('−1 point per $1 · max −2,500','−1 punto por cada $1 · máx. −2,500')):tr(L('−2 points per $1','−2 puntos por cada $1'))},
    {n:L('Scams fallen for','Estafas en las que caíste'),v:-150*(s.scammed||0),d:`${s.scammed||0} × −150`},
    {n:L('Teamwork high fives','Choca esos cinco'),v:25*Math.min(5,(s.hf||[]).length),d:`${Math.min(5,(s.hf||[]).length)}/5 ${tr(L('classmates × 25','compañeros × 25'))}`},
  ];
  parts.forEach(p=>{p.v=p.v||0;});
  const total=Math.max(0,parts.reduce((a,p)=>a+p.v,0));
  return{total,parts,stars:starsN,milestones:Math.min(s.q,QUESTS.length)};
}
/* score codes: name-bound and checksummed, for players who can't post live */
const B32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function h32(str){let h=2166136261;for(const ch of str){h^=ch.codePointAt(0);h=Math.imul(h,16777619);}return h>>>0;}
const normName=n=>String(n||'').trim().toLowerCase().replace(/\s+/g,' ');
const normCls=c=>String(c||'').trim().toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,16);
const slug=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'x';
function makeCode(name,score,stars,ms){
  score=clamp(Math.round(score),0,16383);stars=clamp(stars,0,63);ms=clamp(ms,0,31);
  const chk=h32(`mm2|${normName(name)}|${score}|${stars}|${ms}`)%2048;
  let v=((score*64+stars)*32+ms)*2048+chk,out='';
  for(let i=0;i<8;i++){out=B32[v%32]+out;v=Math.floor(v/32);}
  return out.slice(0,4)+'-'+out.slice(4);
}
function readCode(name,code){
  const t=String(code||'').toUpperCase().replace(/[^0-9A-Z]/g,'').replace(/O/g,'0').replace(/[IL]/g,'1');
  if(t.length!==7&&t.length!==8)return null;let v=0;for(const ch of t){const k=B32.indexOf(ch);if(k<0)return null;v=v*32+k;}
  const v2=t.length===8;const chk=v%2048;v=Math.floor(v/2048);const ms=v%(v2?32:16);v=Math.floor(v/(v2?32:16));const stars=v%(v2?64:32);const score=Math.floor(v/(v2?64:32));
  if(ms>QUESTS.length||stars>QUESTS.length*3||score>16383)return null;
  if(h32(`${v2?'mm2':'mm1'}|${normName(name)}|${score}|${stars}|${ms}`)%2048!==chk)return null;
  return{score,stars,ms};
}
function myCode(){const sc=computeScore();return makeCode(S.name,sc.total,sc.stars,sc.milestones);}

const LB={state:'connecting',db:null,uid:null,canWrite:null,admin:false,docs:[],lastPosted:'',posting:false,again:false,filter:null,inited:false,clsKey:''};
async function initLive(){
  let db=null,user=null;
  try{if(window.claude&&typeof window.claude.use==='function'){[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);}}catch(e){}
  if(user){try{LB.admin=!!(await user.canEdit());}catch(e){}try{LB.uid=await user.id();}catch(e){}try{if((await user.can('data.write'))===false&&!LB.admin)LB.canWrite=false;}catch(e){}}
  if(!db){LB.state='off';paintBoardAll();return;}
  LB.db=db;LB.state=(LB.uid&&LB.canWrite!==false)?'live':'readonly';
  try{db.collection('scores').limit(1000).onSnapshot(snap=>{LB.docs=snap.docs.map(d=>Object.assign({id:d.id},d.data()));paintBoardAll();},()=>{LB.state='off';paintBoardAll();});}
  catch(e){LB.state='off';}
  try{db.collection('live').limit(200).onSnapshot(snap=>{LB.live=snap.docs.map(d=>Object.assign({id:d.id},d.data()));receiveLive();paintBoardAll();},()=>{});}
  catch(e){LB.state='off';}
  paintBoardAll();
  if(S&&S.started&&$('#title').hidden)postScore();
}
async function postScore(){
  if(S&&S.preview)return;
  if(BK.on){if(BK.uid&&S&&S.started)bkQueueSave(true);return;}
  if(!LB.db||!LB.uid||LB.canWrite===false||!S||!S.started)return;
  if(LB.posting){LB.again=true;return;}
  const sc=computeScore();const mine=LB.docs.find(d=>d.id===LB.uid);
  const best=Math.max(sc.total,mine&&typeof mine.best==='number'?mine.best:0);
  const body={name:String(S.name).slice(0,14),cls:normCls(S.cls),score:sc.total,best,ms:sc.milestones,stars:sc.stars,done:!!S.done,src:'live'};
  const key=JSON.stringify(body);if(key===LB.lastPosted)return;
  body.at=Date.now();LB.posting=true;
  try{await LB.db.doc('scores/'+LB.uid).set(body);LB.lastPosted=key;LB.canWrite=true;LB.state='live';}
  catch(e){const c=e&&e.code;if(c==='invalid_argument'){LB.canWrite=false;LB.state='readonly';}
    else if(c==='unavailable'){setTimeout(()=>{LB.lastPosted='';postScore();},1500+Math.random()*2000);}
    else if(c==='revoked'||c==='not_granted'||c==='capability_disabled'){LB.state='off';}}
  LB.posting=false;if(LB.again){LB.again=false;postScore();}
  paintBoardAll();
}

        msg=`<span class="ok">${tr(L(`Added ${okN} of ${lines.length}.`,`Se agregaron ${okN} de ${lines.length}.`))}</span>${out.length?'<br>'+out.join('<br>'):''}`;$('#fMsg').innerHTML=msg;if(okN===lines.length)$('#fBulk').value='';};
      if($('#fClear'))$('#fClear').onclick=()=>{confirmClear=true;r();};
      if($('#fClearNo'))$('#fClearNo').onclick=()=>{confirmClear=false;r();};
      $('#fEvGo').onclick=async()=>{const r2=await sendClassEvent($('#fEv').value);msg=r2;$('#fMsg').innerHTML=msg;};
      if($('#fClearYes'))$('#fClearYes').onclick=async()=>{const del=LB.docs.filter(d=>(d.cls||'')===LB.filter);let n=0;for(const d of del){try{await LB.db.doc('scores/'+d.id).delete();n++;}catch(e){}}confirmClear=false;msg=`<span class="ok">${tr(L(`Removed ${n} scores.`,`Se borraron ${n} puntajes.`))}</span>`;r();};
    }
    paintBoardAll();
  },'wide');
}
async function addByCode(name,cls,code){
  name=String(name||'').trim().slice(0,14);cls=normCls(cls);
  if(!name)return{ok:false,html:`<span class="bad">✕ ${tr(L('Type the student’s name.','Escribe el nombre del estudiante.'))}</span>`};
  const v=readCode(name,code);
  if(!v)return{ok:false,html:`<span class="bad">✕ ${esc(name)} · ${esc(code||'')}: ${tr(L('code doesn’t match this name. Check spelling and the code.','el código no coincide con este nombre. Revisa la ortografía y el código.'))}</span>`};
  if(!LB.db)return{ok:false,html:`<span class="bad">✕ ${tr(L('The live board isn’t connected in this view.','La tabla en vivo no está conectada aquí.'))}</span>`};
  const id='code-'+slug(cls)+'-'+slug(name);const prev=LB.docs.find(d=>d.id===id);
  const best=Math.max(v.score,prev&&typeof prev.best==='number'?prev.best:0);
  try{await LB.db.doc('scores/'+id).set({name,cls,score:v.score,best,ms:v.ms,stars:v.stars,done:v.ms>=8,src:'code',at:Date.now()});}
  catch(e){return{ok:false,html:`<span class="bad">✕ ${esc(name)}: ${tr(L('could not save. Try again.','no se pudo guardar. Inténtalo de nuevo.'))}</span>`};}
  return{ok:true,html:`<span class="ok">✓ ${esc(name)} · ${num(v.score)} ${tr(L('pts','pts'))}${cls?' · '+esc(cls):''}</span>`};
}

function rng(seedStr){let a=h32(seedStr);return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}

function receiveLive(){
  if(!S||!S.started)return;const mine=normCls(S.cls);
  for(const d of (LB.live||[])){if(!d||!d.ev)continue;if(!(d.id==='all'||(mine&&d.id===liveDocId(mine))))continue;

const EMOTES=['👋','🎉','💡','😅','🔥','🙌'];
const PHRASES=[L('Hi!','¡Hola!'),L('Need help?','¿Necesitas ayuda?'),L('Follow me!','¡Sígueme!'),L('Save first!','¡Primero ahorra!'),L('That’s a scam!','¡Eso es una estafa!'),L('Race you!','¡Te echo una carrera!'),L('Nice move!','¡Buena jugada!'),L('Good luck!','¡Buena suerte!')];
const MP={room:null,r:null,filter:null,state:'connecting',peers:new Map(),me:null,lastSend:0,lastKey:'',joining:0,unsub:null,myEm:null};
let nearPeer=null;
async function initRoom(){
  if(BK.on){MP.room=(BK.uid&&BK.ctx&&BK.cfg.sharedWorld!==false)?{join:async()=>supaRoom()}:null;MP.state=MP.room?'nocls':'off';paintSocial();return;}
  let room=null;
  try{if(window.claude&&typeof window.claude.use==='function')room=await window.claude.use('room');}catch(e){}
  if(!room){MP.state='off';paintSocial();return;}
  MP.room=room;joinClassRoom();
}
async function joinClassRoom(){
  if(S&&S.preview)return;
  const tok=++MP.joining;
  if(MP.unsub){try{MP.unsub();}catch(e){}MP.unsub=null;}
  if(MP.r&&MP.r!==MP.room){const old=MP.r;try{await old.leave();}catch(e){}}
  MP.r=null;MP.peers.clear();MP.lastKey='';
  const cls=normCls(S&&S.cls);
  if(!MP.room){MP.state='off';paintSocial();return;}
  if(!S||!S.started||!cls){MP.state='nocls';paintSocial();return;}
  MP.state='connecting';paintSocial();
  let r=null,filter=null;
  try{r=await MP.room.join(('class-'+slug(cls)).slice(0,48));}
  catch(e){const c=e&&e.code;if(c==='not_granted'||c==='revoked'||c==='capability_disabled'||c==='capability_removed'){MP.state='off';paintSocial();return;}r=MP.room;filter=cls;}
  if(tok!==MP.joining)return;
  MP.r=r;MP.filter=filter;
  MP.unsub=r.onPeers(ch=>syncPeers(ch.peers),err=>{MP.state='off';MP.peers.clear();paintSocial();});
  MP.state='on';sendPresence(true);paintSocial();
}
function num01(v,lo,hi,d){v=+v;return Number.isFinite(v)?clamp(v,lo,hi):d;}
function syncPeers(list){
  const seen=new Set();const now=Date.now();
  for(const p of list){
    if(p.sameTab){MP.me=p.peer;continue;}
    if(p.isMe||p.kind!=='viewer')continue;
    const pr=p.presence||{};if(typeof pr.x!=='number'||typeof pr.y!=='number')continue;
    if(MP.filter&&pr.cls!==MP.filter)continue;
    if(pr.lv!=null&&+pr.lv!==curLvl())continue;
    seen.add(p.peer);
    let m=MP.peers.get(p.peer);
    const x=num01(pr.x,0,MW*T,0),y=num01(pr.y,0,MH*T,0);
    if(!m){m={peer:p.peer,rx:x,ry:y,phase:0,emAt:0,sayAt:0,hiAt:0};MP.peers.set(p.peer,m);}
    m.by=p.by;m.x=x;m.y=y;m.dir=['u','d','l','r'].includes(pr.dir)?pr.dir:'d';m.mv=!!pr.mv;
    m.look=Math.floor(num01(pr.look,0,LOOKS.length-1,0));m.nm=String(pr.nm||'').replace(/[\u0000-\u001f]/g,'').slice(0,14)||tr(L('Classmate','Compañero'));
    m.q=Math.floor(num01(pr.q,0,QUESTS.length,0));m.b=!!pr.b;
    if(pr.emAt&&pr.emAt!==m.emSrc){m.emSrc=pr.emAt;m.em=EMOTES.includes(pr.em)?pr.em:null;m.emAt=now;}
    if(pr.sayAt&&pr.sayAt!==m.saySrc){m.saySrc=pr.sayAt;const i=Math.floor(num01(pr.say,0,PHRASES.length-1,-1));m.say=i>=0?i:null;m.sayAt=now;}
    const hi=pr.hi;if(hi&&typeof hi==='object'&&hi.at&&hi.at!==m.hiSrc){m.hiSrc=hi.at;m.hiAt=now;
      if(MP.me&&hi.to===MP.me){floatText(`${m.nm} ${tr(L('high-fived you!','te chocó los cinco!'))}`,'#7FB2FF');sfx('good');}}
  }
  for(const k of [...MP.peers.keys()])if(!seen.has(k))MP.peers.delete(k);
  paintSocial();
}
function sendPresence(force){
  if(!MP.r||MP.state!=='on'||!S||!S.started)return;
  const o={cls:normCls(S.cls),nm:String(S.name).slice(0,14),look:S.look|0,x:Math.round(P.x),y:Math.round(P.y),dir:P.dir,mv:P.moving?1:0,q:Math.min(S.q,QUESTS.length),lv:curLvl(),b:busy||!$('#modal').hidden?1:0};
  const key=JSON.stringify(o);const now=performance.now();
  if(key===MP.lastKey||(!force&&now-MP.lastSend<90))return;
  MP.lastKey=key;MP.lastSend=now;MP.r.presence(o).catch(()=>{});
}
function updateMates(dt){
  sendPresence(false);
  nearPeer=null;let best=46;
  for(const m of MP.peers.values()){
    const k=Math.min(1,dt*10);const dx=m.x-m.rx,dy=m.y-m.ry;
    if(Math.hypot(dx,dy)>T*6){m.rx=m.x;m.ry=m.y;}else{m.rx+=dx*k;m.ry+=dy*k;}
    if(m.mv||Math.hypot(dx,dy)>2)m.phase+=dt*11;
    const d=Math.hypot(m.rx-P.x,m.ry-P.y);if(d<best){best=d;nearPeer=m.peer;}
  }
}
function bubble(c,x,y,text,fill,fg,big){
  c.font=big?'18px system-ui, "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif':'600 10px Lexend, system-ui, sans-serif';
  const w=c.measureText(text).width+(big?12:14),h=big?26:18;
  c.fillStyle=fill;c.strokeStyle='#0E1326';c.lineWidth=1.5;rr(c,x-w/2,y-h,w,h,9);c.fill();c.stroke();
  c.beginPath();c.moveTo(x-4,y-.5);c.lineTo(x,y+5);c.lineTo(x+4,y-.5);c.fill();
  c.fillStyle=fg;c.textAlign='center';c.textBaseline='middle';c.fillText(text,x,y-h/2+.5);
}
function drawMates(c){
  const now=Date.now();
  const tag=(x,y,text,bg,fg)=>{c.font='600 9.5px Lexend, system-ui, sans-serif';const w=c.measureText(text).width+10;c.fillStyle=bg;rr(c,x-w/2,y,w,14,7);c.fill();c.fillStyle=fg;c.textAlign='center';c.textBaseline='middle';c.fillText(text,x,y+7.5);};
  for(const m of MP.peers.values()){
    tag(m.rx,m.ry+6,`${m.nm} · ${m.q}/${QUESTS.length}`,'rgba(60,120,240,.92)','#F6F1E3');
    let by=m.ry-46;
    if(m.hiAt&&now-m.hiAt<1600){bubble(c,m.rx,by,'🙌','#F6F1E3','#0E1326',true);by-=30;}
    else if(m.em&&now-m.emAt<4000){bubble(c,m.rx,by,m.em,'#F6F1E3','#0E1326',true);by-=30;}
    if(m.say!=null&&now-m.sayAt<4500){bubble(c,m.rx,by,tr(PHRASES[m.say]),'#F6F1E3','#0E1326',false);}
    else if(m.b){bubble(c,m.rx,by,'…','#A8B0D3','#0E1326',false);}
  }
  if(MP.state==='on'&&MP.peers.size){const crowd=[...MP.peers.values()].some(m=>Math.abs(m.rx-P.x)<70&&Math.abs(m.ry-P.y)<20);tag(P.x,P.y+(crowd?22:6),`${S.name} · ${tr(L('you','tú'))}`,'rgba(252,204,10,.95)','#0E1326');}
  if(MP.myEm&&now-MP.myEm.at<4000){const e=MP.myEm;if(e.say!=null)bubble(c,P.x,P.y-46,tr(PHRASES[e.say]),'#FCCC0A','#0E1326',false);else bubble(c,P.x,P.y-46,e.em,'#FCCC0A','#0E1326',true);}
}

/* shared world over Supabase Realtime: one channel per squad of 8 classmates,
   position messages throttled to stay inside plan limits */
function supaRoom(){
  const key=BK.uid,gap=Math.max(300,+(BK.cfg.positionIntervalMs||800));
  const ch=BK.sb.channel(`mm-${BK.ctx.class_id}-s${BK.ctx.squad||0}`,{config:{presence:{key},broadcast:{self:false}}});
  let mine={},lastSent=0,timer=null,ready=false;const others=new Map(),hs=[];
  const list=()=>[{peer:key,by:key,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:mine,updatedAt:Date.now()},...others.values()];
  const fire=()=>{const l=list();hs.forEach(h=>{try{h({peers:l,joined:[],left:[],updated:[]});}catch(e){}});};
  const send=force=>{if(!ready)return;const now=Date.now();
    if(!force&&now-lastSent<gap){if(!timer)timer=setTimeout(()=>{timer=null;send(true);},gap-(now-lastSent));return;}
    lastSent=now;try{ch.send({type:'broadcast',event:'s',payload:{k:key,s:mine}});}catch(e){}};
  ch.on('broadcast',{event:'s'},({payload})=>{if(!payload||typeof payload.k!=='string'||payload.k===key||typeof payload.s!=='object')return;
    others.set(payload.k,{peer:payload.k,by:payload.k,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:payload.s||{},updatedAt:Date.now()});fire();});
  ch.on('presence',{event:'leave'},({key:k})=>{if(k!==key&&others.delete(k))fire();});
  ch.on('presence',{event:'join'},({key:k})=>{if(k!==key)send(true);});
  ch.subscribe(async status=>{if(status==='SUBSCRIBED'){ready=true;try{await ch.track({on:1});}catch(e){}send(true);}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){ready=false;}});
  return{presence:async patch=>{mine=Object.assign({},mine,patch);for(const k in patch)if(patch[k]===null)delete mine[k];
      send('em' in patch||'say' in patch||'hi' in patch||patch.mv===0);},
    onPeers:h=>{hs.push(h);setTimeout(fire,0);return()=>{};},peers:list,
    leave:async()=>{ready=false;try{await BK.sb.removeChannel(ch);}catch(e){}},connected:()=>ready};
}

  const n=document.createElement('button');n.className=saved?'btn ghost':'btn';n.textContent=saved?tr(L('New game','Juego nuevo')):tr(L('Start','Empezar'));n.onclick=()=>startGame(true);btns.appendChild(n);
}
$('#tEn').onclick=()=>{S.lang='en';paintTitle();updateHUD();};$('#tEs').onclick=()=>{S.lang='es';paintTitle();updateHUD();};
$('#tName').addEventListener('input',e=>{S.name=e.target.value.trim()||'Alex';});
$('#tCls').addEventListener('input',e=>{S.cls=normCls(e.target.value);});
function placePlayer(){P.x=S.px||8.5*T;P.y=S.py||8.5*T;if(!canStand(P.x,P.y)){P.x=8.5*T;P.y=8.5*T+4;}cam.x=P.x;cam.y=P.y;}
function startGame(fresh){
  const keep={lang:S.lang,name:(($('#tName').value||'').trim()||S.name||'Alex').slice(0,14),cls:normCls($('#tCls').value||S.cls),look:S.look};
  S=newState(keep);S.started=true;loadLevel(1);spawnPlayer();S.seed=keep.cls?`${keep.cls}|${today()}`:'solo|'+Math.random().toString(36).slice(2);saved=null;rebuildNpcSolid();placePlayer();
  $('#title').hidden=true;document.body.classList.remove('titling');lastScore=null;updateHUD();save();postScore();joinClassRoom();
  setTimeout(()=>toast(tr(QUESTS[0].steps[0].obj),'blue'),300);
}

let facOpen=false;
function paintFac(){const f=$('#tFac');if(!f)return;
  if(!facOpen){f.innerHTML=`<button class="linkbtn" id="tFacGo">${tr(L('Facilitator preview: jump to Level 2 or 3','Vista previa del facilitador: ir al Nivel 2 o 3'))}</button>`;$('#tFacGo').onclick=()=>{facOpen=true;paintFac();};return;}
  f.innerHTML=`<div class="eyebrow">${tr(L('FACILITATOR PREVIEW','VISTA PREVIA DEL FACILITADOR'))}</div>
  <div class="callout">${tr(L('Play a level without finishing the ones before it. You start with a typical student’s money, credit and choices from the earlier levels. Preview play isn’t saved, doesn’t touch any saved game, and doesn’t go on the leaderboard.','Juega un nivel sin terminar los anteriores. Empiezas con el dinero, crédito y decisiones de un estudiante típico de los niveles anteriores. La vista previa no se guarda, no toca ningún juego guardado y no aparece en la tabla.'))}</div>
  <div class="row"><button class="btn" id="tFac2">${tr(L('Level 2 · College Town','Nivel 2 · Pueblo Universitario'))}</button><button class="btn" id="tFac3">${tr(L('Level 3 · The Big City','Nivel 3 · La Gran Ciudad'))}</button><button class="btn ghost" id="tFacX">${tr(L('Cancel','Cancelar'))}</button></div>`;
  $('#tFac2').onclick=()=>startPreview(2);$('#tFac3').onclick=()=>startPreview(3);$('#tFacX').onclick=()=>{facOpen=false;paintFac();};}
function startPreview(lv){
  const keep={lang:S.lang,name:(($('#tName').value||'').trim()||S.name||'Alex').slice(0,14),cls:'',look:S.look};
  S=Object.assign(newState(keep),JSON.parse(JSON.stringify(PREVIEW_PRESETS[lv])));
  S.started=true;S.preview=true;S.seed='preview|'+Math.random().toString(36).slice(2);S.px=null;S.py=null;
  loadLevel(lv);rebuildNpcSolid();spawnPlayer();
  $('#title').hidden=true;document.body.classList.remove('titling');lastScore=null;updateHUD();
  setTimeout(async()=>{if(busy)return;busy=true;document.body.classList.add('busy');try{await enterLevel(lv);}catch(e){}busy=false;document.body.classList.remove('busy');
    toast(tr(L('Facilitator preview: not saved or scored','Vista previa: no se guarda ni cuenta')),'blue');setTimeout(()=>toast(tr(QUESTS[S.q].steps[S.step].obj),'blue'),2600);},300);
}
function resume(){const keepLang=S.lang;S=Object.assign(newState({}),saved);S.lang=keepLang;if(S.done&&S.q<QUESTS.length)S.done=false;loadLevel(curLvl());if(S.cls==null)S.cls='';if(!S.seed)S.seed='solo|'+Math.random().toString(36).slice(2);if(!S.cevDone)S.cevDone=[];if(!S.evLog)S.evLog=[];if(!S.idle)S.idle={};if(!S.hf)S.hf=[];rebuildNpcSolid();placePlayer();$('#title').hidden=true;document.body.classList.remove('titling');lastScore=null;updateHUD();postScore();joinClassRoom();
  {const lv=curLvl();if(lv>1&&!(S.lvSeen||[]).includes(lv)){setTimeout(async()=>{if(busy)return;busy=true;document.body.classList.add('busy');try{await enterLevel(lv);}catch(e){}busy=false;document.body.classList.remove('busy');},400);}}
  if(S.done)toast(tr(UI.freeRoam),'blue');else toast(tr(QUESTS[S.q].steps[S.step].obj),'blue');}
setInterval(()=>{if(S&&S.started&&$('#title').hidden){S.px=P.x;S.py=P.y;saveLocal();}},4000);
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&BK.on&&BK.uid&&S&&S.started){S.px=P.x;S.py=P.y;BK.dirty=true;bkSaveNow();}});

function boot(){
  bkInit();
  saved=(BK.on&&!BK.guest)?null:loadSaved();S=newState(saved?{lang:saved.lang,name:saved.name,cls:saved.cls,look:saved.look}:{});
  $('#tName').value=S.name;$('#tCls').value=S.cls||'';
  loadLevel(1);
  document.body.classList.add('titling');resize();paintTitle();updateHUD();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{updateHUD();});
  requestAnimationFrame(frame);
  if(BK.on)bkBoot();else{initLive();initRoom();}
  if(location.hash==='#leaderboard')openBig();
}
boot();
})();
